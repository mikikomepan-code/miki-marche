<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルシェパン原価 & 価格設定シミュレーター</title>
    <!-- スマホのホーム画面アイコン設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #FAF6F0;
            color: #5A4A42;
        }
        
        .font-kiwi {
            font-family: 'Kiwi Maru', serif;
        }

        .bg-warm-white { background-color: #FFFFFF; }
        .bg-cream { background-color: #FFFDF9; }
        .bg-accent-light { background-color: #FFF3E0; }
        .bg-accent-main { background-color: #E67E22; }
        .bg-accent-hover { background-color: #D35400; }
        .text-accent-main { color: #D35400; }
        .border-accent-light { border-color: #FFE0B2; }
        .border-accent-main { border-color: #E67E22; }

        /* Custom Scrollbar for tab navigation */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-orange-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🥐</span>
                <h1 class="font-kiwi text-lg md:text-xl font-bold text-amber-900">マルシェパン原価 & 価格設定シミュレーター</h1>
            </div>
            <button onclick="resetAllData()" class="text-xs text-amber-700 hover:text-amber-900 bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-full border border-amber-200 transition duration-150 flex items-center space-x-1">
                <i class="fa-solid font-bold fa-rotate-right"></i>
                <span>リセット</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto w-full px-4 pt-6 flex-grow">

        <!-- Navigation Tabs -->
        <div class="flex space-x-2 border-b border-orange-200 mb-6 overflow-x-auto no-scrollbar">
            <button id="tab-btn-1" onclick="switchTab(1)" class="tab-btn py-2.5 px-4 font-bold text-sm md:text-base border-b-2 border-orange-500 text-orange-600 flex items-center space-x-2 whitespace-nowrap">
                <span class="bg-orange-100 text-orange-600 rounded-full w-6 h-6 flex items-center justify-center text-xs">1</span>
                <span>材料・レシピ登録</span>
            </button>
            <button id="tab-btn-2" onclick="switchTab(2)" class="tab-btn py-2.5 px-4 font-bold text-sm md:text-base border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center space-x-2 whitespace-nowrap">
                <span class="bg-gray-100 text-gray-500 rounded-full w-6 h-6 flex items-center justify-center text-xs">2</span>
                <span>包材・固定費</span>
            </button>
            <button id="tab-btn-3" onclick="switchTab(3)" class="tab-btn py-2.5 px-4 font-bold text-sm md:text-base border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center space-x-2 whitespace-nowrap">
                <span class="bg-gray-100 text-gray-500 rounded-full w-6 h-6 flex items-center justify-center text-xs">3</span>
                <span>価格設定・結果</span>
            </button>
        </div>

        <!-- TAB 1: 材料・レシピ登録 -->
        <div id="tab-content-1" class="tab-content space-y-6">
            
            <!-- Basic Recipe Info -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100">
                <h2 class="font-kiwi text-base md:text-lg font-bold text-amber-900 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-wheat-awn text-orange-400"></i>
                    <span>レシピ基本情報</span>
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">パンの名前</label>
                        <input type="text" id="recipe-name" value="米粉プレーンベーグル" class="w-full bg-cream border border-orange-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">1回の仕込みでの焼き上がり個数</label>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="batch-yield" value="6" min="1" oninput="calculateAll()" class="w-full bg-cream border border-orange-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400 transition text-right font-medium">
                            <span class="text-sm text-gray-600 font-bold">個</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ingredients List -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-kiwi text-base md:text-lg font-bold text-amber-900 flex items-center space-x-2">
                        <i class="fa-solid fa-scale-balanced text-orange-400"></i>
                        <span>使用材料（1仕込み分）</span>
                    </h2>
                    <span class="text-xs text-gray-500">※購入価格と容量から自動計算</span>
                </div>

                <!-- Table Header -->
                <div class="hidden md:grid grid-cols-12 gap-2 text-xs font-bold text-gray-500 pb-2 border-b border-gray-100 px-2">
                    <div class="col-span-3">材料名</div>
                    <div class="col-span-3">購入価格（円）/ 購入容量</div>
                    <div class="col-span-3">使用量</div>
                    <div class="col-span-2 text-right">コスト</div>
                    <div class="col-span-1 text-center">削除</div>
                </div>

                <!-- Ingredients Container -->
                <div id="ingredients-container" class="space-y-3 md:space-y-2 mt-2">
                    <!-- Dynamic Rows go here -->
                </div>

                <button onclick="addIngredientRow()" class="mt-4 w-full py-2.5 border-2 border-dashed border-orange-200 hover:border-orange-300 text-orange-600 hover:text-orange-700 bg-orange-50/50 hover:bg-orange-50 rounded-xl text-sm font-bold flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新しい材料を追加する</span>
                </button>
            </div>

            <!-- Recipe Summary Card -->
            <div class="bg-amber-900 text-white rounded-2xl p-5 shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="space-y-1 text-center md:text-left">
                    <span class="text-xs text-amber-200 font-bold">1仕込み（6個分）の材料費合計</span>
                    <div class="text-2xl font-bold font-kiwi" id="batch-material-cost-display">0 円</div>
                </div>
                <div class="h-px md:h-12 w-full md:w-px bg-amber-700"></div>
                <div class="space-y-1 text-center md:text-right">
                    <span class="text-xs text-amber-200 font-bold">パン1個あたりの材料費</span>
                    <div class="text-3xl font-bold text-orange-300 font-kiwi" id="unit-material-cost-display">0 円</div>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="switchTab(2)" class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-xl font-bold shadow-sm flex items-center space-x-2 transition">
                    <span>次へ：包材・固定費の設定</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- TAB 2: 包材・固定費 -->
        <div id="tab-content-2" class="tab-content space-y-6 hidden">
            
            <!-- Packaging Section -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100">
                <h2 class="font-kiwi text-base md:text-lg font-bold text-amber-900 mb-2 flex items-center space-x-2">
                    <i class="fa-solid fa-box-open text-orange-400"></i>
                    <span>1個あたりの包材・ラッピング費</span>
                </h2>
                <p class="text-xs text-gray-500 mb-4">個包装袋、シール、リボン、ショップカードなどパン1個にかかる費用</p>

                <div id="packaging-container" class="space-y-3 md:space-y-2">
                    <!-- Dynamic Packaging Rows -->
                </div>

                <button onclick="addPackagingRow()" class="mt-4 w-full py-2 border-2 border-dashed border-orange-200 hover:border-orange-300 text-orange-600 rounded-xl text-xs font-bold flex items-center justify-center space-x-2 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>包材を追加する</span>
                </button>
            </div>
